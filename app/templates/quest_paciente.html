<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados do Paciente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Seus estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-0 m-0 bg-light">

    <form method="POST" action="{{ url_for('questionario_paciente') }}" class="w-100 min-vh-100 d-flex flex-column">
        {{ form.csrf_token }}

        <main id="questionario" class="flex-grow-1 d-flex flex-column justify-content-between py-4">

            <!-- Grid de Responsividade do Bootstrap -->
            <div class="container my-auto">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                        <section class="conteudoQuest">

                            <!-- Título e Barra de Progresso -->
                            <div class="tituloQuest mb-4">
                                <h1 class="h3 fw-bold mb-3">Antes de tudo...</h1>
                                <div class="barraProgresso">
                                    <span class="progressoCompleto"></span>
                                </div>
                            </div>

                            <!-- Área de Pergunta e Inputs -->
                            <div class="areaPergunta">

                                <p class="pergunta mb-3 fs-5 fw-medium">
                                    Sobre você...
                                </p>

                                <div class="containerFormDados">
                                    
                                    <!-- Bloco: Aniversário -->
                                    <div class="blocoPergunta mb-3">
                                        <label class="form-label mb-2 fw-medium">Seu aniversário</label>
                                        <div class="grupoDataAniversario d-flex gap-2">
                                            {{ form.dia(class="form-select") }}
                                            {{ form.mes(class="form-select") }}
                                            {{ form.ano(class="form-select") }}
                                        </div>
                                    </div>

                                    <!-- Bloco: Sexo -->
                                    <div class="blocoPergunta mb-3">
                                        <label class="form-label mb-2 fw-medium">Sexo</label>
                                        {{ form.sexo(class="form-select") }}
                                    </div>

                                    <!-- Bloco: Tipo de Diabetes -->
                                    <div class="blocoPergunta mb-3">
                                        <label class="form-label mb-2 fw-medium">Tipo de diabetes</label>
                                        {{ form.tipo_diabetes(class="form-select") }}
                                    </div>

                                </div>

                            </div>

                            <!-- Botão Continuar -->
                            <div class="areaContinuar mt-4 pt-2">
                                <button type="submit" id="btnContinuar" class="btn w-100 py-3">CONTINUAR</button>
                            </div>

                        </section>

                    </div>
                </div>
            </div>

            <!-- Rodapé -->
            <footer class="footer mt-auto py-3 text-center">
                <div class="logo">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="mb-1" style="width: 35px;">
                    <strong class="d-block">GlicoHealth</strong>
                    <small class="text-muted">2026</small>
                </div>
            </footer>

        </main>
    </form>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
