<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
</head>
<body class="p-0 m-0 bg-light">

    <main id="questionario" class="flex-grow-1 d-flex flex-column justify-content-between py-4">
        
        <div class="container my-auto">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5" style="max-width: 400px;">
                    
                    <section class="conteudoQuest px-2">
                        <div class="tituloQuest mb-4">
                            <h1 class="h3 fw-bold mb-3">Antes de tudo...</h1>
                            <div class="barraProgresso">
                                <span class="progressoCompleto"></span>
                            </div>
                        </div>

                        <div class="areaPergunta">
                            <p class="pergunta mb-4 fs-5">Sobre o paciente a acompanhar...</p>
                            
                            <div id="cadastroQuest">
                                <form id="associarPacienteForm" action="{{ url_for('quest_verificar_paciente') }}" method="POST" novalidate>
                                    {{ form.hidden_tag() }}
                                    {% if is_responsible %}
                                    <div class="mb-3">
                                        <label for="relacaoResponsavelAssociacao" class="form-label">Relação com o paciente</label>
                                        <select id="relacaoResponsavelAssociacao" name="relacao_responsavel" class="select-responsavel" required>
                                            {% for relacao in relacoes_disponiveis %}
                                            <option value="{{ relacao }}" {% if relacao == relacao_responsavel %}selected{% endif %}>{{ relacao }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    {% endif %}

                                    <div class="mb-3">
                                        <i class="fa-solid fa-envelope"></i>
                                        {{ form.email(placeholder="Email", class="d-inline-block w-auto") }}
                                        {% for error in form.email.errors %}
                                            <span class="text-danger d-block small">{{ error }}</span>
                                        {% endfor %}
                                    </div>

                                    <div class="areaContinuar mt-4 pt-2 text-center">
                                        <button type="submit" id="btnContinuar" class="btn py-2 px-5 rounded-pill shadow-sm" style="min-width: 180px;">
                                            Associar Paciente
                                        </button>
                                        <p class="link-login mt-4 small text-muted mb-0 text-center">
                                            Paciente não cadastrado?<a href="{{ url_for('questionario_paciente') }}">Cadastre-o</a>
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </section>

                </div>
            </div>
        </div>

        <footer class="footer mt-auto py-3 text-center">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GlicoHealth" class="mb-1" style="width: 35px;">
                <strong class="d-block">GlicoHealth</strong>
                <small class="text-muted">2026</small>
            </div>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/flash_messages.js') }}"></script>
    <script src="{{ url_for('static', filename='js/associar_paciente.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
