<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de Cuidador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-0 m-0 bg-light">

    <form method="POST" action="" class="w-100 min-vh-100 d-flex flex-column">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <main id="questionario" class="flex-grow-1 d-flex flex-column justify-content-between py-4">
            
            <div class="container my-auto">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                        
                        <section class="conteudoQuest">
                            <div class="tituloQuest mb-4">
                                <h1 class="h3 fw-bold mb-3">Antes de tudo...</h1>
                                <div class="barraProgresso">
                                    <span></span>
                                </div>
                            </div>

                            <!-- Área de Pergunta e Opções -->
                            <div class="areaPergunta">
                                <p class="pergunta mb-4 fs-5">Qual tipo de cuidador?</p>
                                
                                <div class="tiposCuidador"> 
                                    <button type="button" class="tipoCuidador-button" data-role="familiar">
                                        <span>Familiar</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>

                                    <button type="button" class="tipoCuidador-button" data-role="profissional">
                                        <span>Profissional</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>
                                </div>

                                <!-- Inputs ocultos que capturam a seleção via JavaScript -->
                                <div class="d-none">
                                    <input type="radio" name="tipo_cuidador" value="familiar" id="check-familiar">
                                    <input type="radio" name="tipo_cuidador" value="profissional" id="check-profissional">
                                </div>
                            </div>

                            <div class="areaContinuar mt-4 pt-2">
                                <button type="submit" id="btnContinuar" class="btn w-100 py-3">CONTINUAR</button>
                            </div>
                        </section>

                    </div>
                </div>
            </div>

            <footer class="footer mt-auto py-3 text-center">
                <div class="logo">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GlicoHealth" class="mb-1" style="width: 35px;">
                    <strong class="d-block">GlicoHealth</strong>
                    <small class="text-muted">2026</small>
                </div>
            </footer>

        </main>
    </form>

    <script src="{{ url_for('static', filename='js/questionario.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tipo_cuidador.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
