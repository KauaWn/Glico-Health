<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário Cuidador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<main class="questionario">

    <section class="conteudoQuest">

        <div class="tituloQuest">
            <h1>Antes de tudo...</h1>

            <div class="barraProgresso">
                <span class="progressoCompleto"></span>
            </div>
        </div>

        <div class="areaPergunta">

            <p class="pergunta">
                Qual tipo de cuidador?
            </p>

            <div class="opcoes">

                <a href="{{ url_for('quest_verificar_paciente') }}"
                   class="opcao selecionada">
                    Familiar
                </a>

                <a href="{{ url_for('quest_tipo_cuidador') }}"
                   class="opcao">
                    Profissional contratado
                </a>

            </div>

        </div>

    </section>

    <footer class="footer">
        <img src="{{ url_for('static', filename='img/logo.png') }}"
             alt="Logo">

        <strong>GlicoHealth</strong>
        <small>2026</small>
    </footer>

</main>

</body>
</html>
