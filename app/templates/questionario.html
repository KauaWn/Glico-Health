<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papéis de Usuário</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Seu CSS Próprio (Mantido abaixo do Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-0 m-0 bg-light">

    <form method="POST" action="{{ url_for('questionario') }}" id="formQuestionario" class="w-100 min-vh-100 d-flex flex-column">
        {{ form.csrf_token }}

        <main id="questionario" class="flex-grow-1 d-flex flex-column justify-content-between">
            
            <!-- Grid de Centralização Responsiva -->
            <div class="container py-4 my-auto">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                        
                        <section class="conteudoQuest mx-auto">
                            <!-- Título e Barra de Progresso -->
                            <div class="tituloQuest">
                                <h1>Antes de tudo...</h1>
                                <div class="barraProgresso">
                                    <span></span>
                                </div>
                            </div>

                            <!-- Área de Pergunta e Opções -->
                            <div class="areaPergunta">
                                <p class="pergunta">Qual o seu papel na plataforma?</p>
                                
                                <div class="papeis">
                                    <button type="button" class="role-button" data-role="paciente">
                                        <span>Paciente</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>

                                    <button type="button" class="role-button" data-role="cuidador">
                                        <span>Cuidador</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>

                                    <button type="button" class="role-button" data-role="responsavel">
                                        <span>Responsável legal</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>
                                </div>

                                <!-- Checkboxes ocultos para envio do Flask Form -->
                                <div class="d-none">
                                    <input type="checkbox" name="papeis" value="paciente" id="check-paciente">
                                    <input type="checkbox" name="papeis" value="cuidador" id="check-cuidador">
                                    <input type="checkbox" name="papeis" value="responsavel" id="check-responsavel">
                                </div>
                                
                                <!-- Exibição de Erros -->
                                {% if form.papeis.errors %}
                                    <div class="text-danger small mt-3 text-start fw-medium">
                                        {% for error in form.papeis.errors %}
                                            <p class="mb-1"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}</p>
                                        {% endfor %}
                                    </div>
                                {% endif %}
                            </div>

                            <!-- Área de Ação/Avançar -->
                            <div class="areaContinuar mt-4">
                                <p>Você pode selecionar uma ou mais opções</p>
                                <button type="submit" id="btnContinuar" class="btn">CONTINUAR</button>
                            </div>
                        </section>

                    </div>
                </div>
            </div>

            <!-- Rodapé Centralizado -->
            <footer class="footer py-3">
                <div class="logo">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GlicoHealth">
                    <strong>GlicoHealth</strong>
                    <small>2026</small>
                </div>
            </footer>

        </main>
    </form>

    <!-- JS do Projeto e Bootstrap -->
    <script src="{{ url_for('static', filename='js/questionario.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
