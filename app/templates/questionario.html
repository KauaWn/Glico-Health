<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papéis de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-0 m-0 bg-light">

    <form method="POST" action="" id="formQuestionario" class="w-100 min-vh-100 d-flex flex-column">
        {{ form.csrf_token }}

        <main id="questionario" class="flex-grow-1 d-flex flex-column justify-content-between py-4">
            
            <div class="container my-auto">
                <div class="row justify-content-center">
                    <!-- Ajuste de colunas responsivas: 100% em mobile, max-width controlado em desktop -->
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                        
                        <section class="conteudoQuest">
                            <!-- Título e Barra de Progresso -->
                            <div class="tituloQuest mb-4">
                                <h1 class="h3 fw-bold mb-3">Antes de tudo...</h1>
                                <div class="barraProgresso">
                                    <span></span>
                                </div>
                            </div>

                            <!-- Área de Pergunta e Opções -->
                            <div class="areaPergunta">
                                <p class="pergunta mb-4 fs-5">Qual o seu papel na plataforma?</p>
                                
                                <div class="papeis">
                                    <button type="button" class="role-button" data-role="paciente">
                                        <span>Paciente</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>

                                    <button type="button" class="role-button" data-role="cuidador">
                                        <span>Cuidador</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>

                                    <button type="button" class="role-button" data-role="responsavel">
                                        <span>Responsável legal</span>
                                        <span class="check"><i class="fa-solid fa-check"></i></span>
                                    </button>
                                </div>

                                <!-- Checkboxes ocultos para envio do Flask Form -->
                                <div class="d-none">
                                    <input type="checkbox" name="papeis" value="paciente" id="check-paciente">
                                    <input type="checkbox" name="papeis" value="cuidador" id="check-cuidador">
                                    <input type="checkbox" name="papeis" value="responsavel" id="check-responsavel">
                                </div>
                                
                                <!-- Exibição de Erros -->
                                {% if form.papeis.errors %}
                                    <div class="text-danger small mt-3 text-start fw-medium">
                                        {% for error in form.papeis.errors %}
                                            <p class="mb-1"><i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}</p>
                                        {% endfor %}
                                    </div>
                                {% endif %}
                            </div>

                            <!-- Área de Ação/Avançar -->
                            <div class="areaContinuar mt-4 pt-2">
                                <p class="text-muted small mb-3">Você pode selecionar uma ou mais opções</p>
                                <button type="submit" id="btnContinuar" class="btn w-100 py-3">CONTINUAR</button>
                            </div>
                        </section>

                    </div>
                </div>
            </div>

            <!-- Rodapé Centralizado -->
            <footer class="footer mt-auto py-3 text-center">
                <div class="logo">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo GlicoHealth" class="mb-1" style="width: 35px;">
                    <strong class="d-block">GlicoHealth</strong>
                    <small class="text-muted">2026</small>
                </div>
            </footer>

        </main>
    </form>

    <script src="{{ url_for('static', filename='js/questionario.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
