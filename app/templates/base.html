<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlicoHealth{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    {% block styles %}{% endblock %}
</head>

<body>
    {% block alerts %}{% endblock %}

    <div class="container-fluid p-3 p-md-4">
        <div class="row g-3">
            <aside class="coluna1 col-12 col-lg-2 d-none d-lg-block">
                <div class="sidebar p-3 text-center d-flex flex-column justify-content-between h-100">
                    <div>
                        <div class="brand mb-5">
                            <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3">
                            <h1>GlicoHealth™</h1>
                        </div>
                        <nav class="nav flex-column gap-3 text-start ps-3">
                            <a class="nav-link {{ 'text-white active' if request.endpoint == 'home' else 'text-white-50' }}" href="{{ url_for('home') }}"><i class="fa-solid fa-house me-2"></i> Início</a>
                            <a class="nav-link {{ 'text-white active' if request.endpoint == 'perfil' else 'text-white-50' }}" href="{{ url_for('perfil') }}"><i class="fa-regular fa-user me-2"></i> Perfil</a>
                            <div>
                                <a class="nav-link {{ 'text-white' if request.endpoint in ['pediabetico', 'registroglicemia'] else 'text-white-50' }} d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#submenuRegistroDesktop" role="button" aria-expanded="{{ 'true' if request.endpoint in ['pediabetico', 'registroglicemia'] else 'false' }}" aria-controls="submenuRegistroDesktop">
                                    <span><i class="bi bi-droplet me-2"></i> Registro</span>
                                    <i class="bi bi-chevron-down small"></i>
                                </a>
                                <div class="collapse {{ 'show' if request.endpoint in ['pediabetico', 'registroglicemia'] else '' }} ps-3 mt-2" id="submenuRegistroDesktop">
                                    <a class="nav-link {{ 'text-white active' if request.endpoint == 'pediabetico' else 'text-white-50' }} py-1 small submenu-item" href="{{ url_for('pediabetico') }}"><i class="bi bi-circle me-2" style="font-size: 0.6rem;"></i> Pé Diabético</a>
                                    <a class="nav-link {{ 'text-white active' if request.endpoint == 'registroglicemia' else 'text-white-50' }} py-1 small submenu-item" href="{{ url_for('registroglicemia') }}"><i class="bi bi-circle me-2" style="font-size: 0.6rem;"></i> Glicemia</a>
                                </div>
                            </div>
                        </nav>
                    </div>
                    <div>
                        <a class="nav-link text-white-50 text-start ps-3" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
                    </div>
                </div>
            </aside>

            <div class="col-12 d-lg-none mb-2">
                <button class="btn btn-menu-mobile d-flex align-items-center justify-content-center" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-label="Abrir menu">
                    <i class="bi bi-list fs-4"></i>
                </button>
            </div>

            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
        <div class="offcanvas-header">
            <div class="brand d-flex flex-column align-items-center">
                <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3 brand-logo-mobile">
                <h5 class="offcanvas-title fw-bold" id="mobileSidebarLabel">GlicoHealth™</h5>
            </div>
            <div class="btnClose d-flex">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
            </div>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <nav class="nav flex-column gap-3">
                <a class="nav-link {{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}"><i class="fa-solid fa-house me-2"></i> Início</a>
                <a class="nav-link {{ 'active' if request.endpoint == 'perfil' else '' }}" href="{{ url_for('perfil') }}"><i class="bi bi-person me-2"></i> Perfil</a>
                <div>
                    <a class="nav-link {{ 'active' if request.endpoint in ['pediabetico', 'registroglicemia'] else '' }} d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#submenuRegistroMobile" role="button" aria-expanded="{{ 'true' if request.endpoint in ['pediabetico', 'registroglicemia'] else 'false' }}" aria-controls="submenuRegistroMobile">
                        <span><i class="bi bi-droplet me-2"></i> Registro</span>
                        <i class="bi bi-chevron-down small"></i>
                    </a>
                    <div class="collapse {{ 'show' if request.endpoint in ['pediabetico', 'registroglicemia'] else '' }} ps-3 mt-2" id="submenuRegistroMobile">
                        <a class="nav-link {{ 'active' if request.endpoint == 'pediabetico' else '' }} py-1 small submenu-item mb-2" href="{{ url_for('pediabetico') }}"><i class="bi bi-circle me-2" style="font-size: 0.6rem;"></i> Pé Diabético</a>
                        <a class="nav-link {{ 'active' if request.endpoint == 'registroglicemia' else '' }} py-1 small submenu-item" href="{{ url_for('registroglicemia') }}"><i class="bi bi-circle me-2" style="font-size: 0.6rem;"></i> Glicemia</a>
                    </div>
                </div>
            </nav>
            <div>
                <a class="nav-link" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
            </div>
        </div>
    </div>

    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
