<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - GlicoHealth™</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>

<body>

  <div class="container-fluid p-3 p-md-4">
    <div class="row g-3">

      <!-- COLUNA 1: SIDEBAR (Proporção col-lg-2 idêntica à Home) -->
      <aside class="coluna1 col-12 col-lg-2 d-none d-lg-block">
        <div class="sidebar p-3 text-center d-flex flex-column justify-content-between h-100">
          <div>
            <div class="brand mb-5">
              <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3">
              <h1>GlicoHealth™</h1>
            </div>
            <nav class="nav flex-column gap-3 text-start ps-3">
              <a class="nav-link text-white-50" href="{{ url_for('home') }}"><i class="fa-solid fa-house me-2"></i> Início</a>
              <a class="nav-link text-white active" href="{{ url_for('perfil') }}"><i class="fa-solid fa-user me-2"></i> Perfil</a>
              <a class="nav-link text-white-50" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
            </nav>
          </div>
          <div>
            <a class="nav-link text-white-50 text-start ps-3" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
          </div>
        </div>
      </aside>

      <!-- BOTÃO MENU (MOBILE) -->
      <div class="col-12 d-lg-none mb-2">
        <button class="btn btn-menu-mobile d-flex align-items-center justify-content-center" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
          <i class="bi bi-list fs-4"></i>
        </button>
      </div>

      <!-- CONTEÚDO PRINCIPAL (10 Colunas) -->
      <main class="col-12 col-lg-10">
        <div class="card-profile p-0 p-lg-4">
          <form>
            <div class="text-center mb-4">
              <div class="avatar-wrapper mx-auto mb-2">
                <img src="{{ url_for('static', filename='img/macaquinho.jpg') }}" alt="Foto de perfil">
                <label for="fotoInput" class="avatar-edit-btn">
                  <i class="bi bi-plus"></i>
                </label>
                <input type="file" id="fotoInput" class="d-none" accept="image/*">
              </div>
              <h5 class="fw-bold mb-0 profile-name">Anna Clara</h5>
              <small class="profile-username">@ann4torres</small>
            </div>

            <div class="row g-3 justify-content-center">
              <div class="col-12 col-md-8 col-lg-6">
                <label class="form-label custom-label">Nome completo</label>
                <input type="text" class="form-control custom-input" value="Anna Clara de Melo Torres">
              </div>

              <div class="w-100"></div>

              <div class="col-12 col-md-8 col-lg-6">
                <label class="form-label custom-label">Email</label>
                <input type="email" class="form-control custom-input" value="anna.torres@escolar.ifrn.edu.br">
              </div>

              <div class="w-100"></div>

              <div class="col-6 col-md-4 col-lg-3">
                <label class="form-label custom-label">Tipo de diabete</label>
                <input type="text" class="form-control custom-input" value="Tipo 1">
              </div>

              <div class="col-6 col-md-4 col-lg-3">
                <label class="form-label custom-label">Idade</label>
                <input type="text" class="form-control custom-input" value="17 anos">
              </div>

              <div class="w-100"></div>

              <div class="col-6 col-md-4 col-lg-3">
                <label class="form-label custom-label">Sexo</label>
                <input type="text" class="form-control custom-input" value="Feminino">
              </div>

              <div class="col-6 col-md-4 col-lg-3">
                <label class="form-label custom-label">Peso</label>
                <input type="text" class="form-control custom-input" value="1 kg">
              </div>
            </div>

            <div class="text-center mt-4 pt-2">
              <button type="submit" class="btn btn-alterar">Alterar</button>
            </div>
          </form>
        </div>
      </main>

    </div>
  </div>

  <!-- MENU OFFCANVAS (MOBILE) -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
    <div class="offcanvas-header">
      <div class="brand d-flex flex-column align-items-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3 brand-logo-mobile">
        <h5 class="offcanvas-title fw-bold">GlicoHealth™</h5>
      </div>
      <div class="btnClose d-flex">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <nav class="nav flex-column gap-3">
        <a class="nav-link" href="{{ url_for('home') }}"><i class="fa-solid fa-house me-2"></i> Início</a>
        <a class="nav-link active" href="{{ url_for('perfil') }}"><i class="fa-solid fa-user me-2"></i> Perfil</a>
        <a class="nav-link" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
      </nav>
      <div>
        <a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
