<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="container-fluid p-3 p-md-4">
    <div class="row g-3">

      <aside class="coluna1 col-12 col-lg-2 d-none d-lg-block">
        <div class="sidebar p-3 text-center d-flex flex-column justify-content-between h-100">
          <div>
            <div class="brand mb-5">
              <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3">
              <h1>GlicoHealth™</h1>
            </div>
            <nav class="nav flex-column gap-3 text-start ps-3">
              <a class="nav-link text-white active" href="#"><i class="fa-solid fa-house me-2"></i> Início</a>
              <a class="nav-link text-white-50" href="#"><i class="fa-solid fa-user me-2"></i> Perfil</a>
              <a class="nav-link text-white-50" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
            </nav>
          </div>
          <div>
            <a class="nav-link text-white-50 text-start ps-3" href="#"><i class="bi bi-box-arrow-right me-2"></i>
              Sair</a>
          </div>
        </div>
      </aside>

      <!-- BOTÃO MENU (APENAS MOBILE) -->
      <div class="col-12 d-lg-none mb-2">
        <button class="btn btn-menu-mobile d-flex align-items-center gap-2" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#mobileSidebar">
          <i class="bi bi-list fs-4"></i>
        </button>
      </div>

      <main class="col-12 col-lg-7">
        <div class="d-flex flex-column gap-3">

          <div class="card-custom bemvindo p-3 bg-purple text-white d-flex align-items-center gap-3">
            <img src="{{ url_for('static', filename='img/macaquinho.jpg') }}" id="perfil-img" class="rounded-circle"
              alt="Foto de perfil">
            <div>
              <h5 class="mb-0">Seja bem-vindo(a), Usuário</h5>
              <small class="opacity-75">Acompanhe seus dados</small>
            </div>
          </div>

          <div class="card-custom p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold mb-0" style="color: #4a3e56;">Nível glicêmico</h6>

              <!-- Botões de Filtragem -->
              <div class="btn-group btn-group-sm" role="group" aria-label="Filtro do Gráfico">
                <button type="button" class="btn btn-outline-purple active"
                  onclick="filtrarGrafico('dia', this)">Dia</button>
                <button type="button" class="btn btn-outline-purple"
                  onclick="filtrarGrafico('semana', this)">Semana</button>
                <button type="button" class="btn btn-outline-purple" onclick="filtrarGrafico('mes', this)">Mês</button>
              </div>
            </div>

            <div style="position: relative; height: 180px; width: 100%;">
              <canvas id="graficoNivelGlicemico"></canvas>
            </div>
          </div>
          <div class="card-custom p-3">


            <div style="height: 150px;" class="d-flex align-items-center justify-content-center text-muted">
              Área do Pé Diabético
            </div>
          </div>

        </div>
      </main>

      <!-- COLUNA 3: CALENDÁRIO / PAINEL DIREITO -->
      <aside class="col-12 col-lg-3">
        <div class="card-custom p-3">
          <!-- Div onde o FullCalendar será renderizado -->
          <div id="calendario"></div>
        </div>
      </aside>

    </div>
  </div>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
    <div class="offcanvas-header">
      <div class="brand d-flex flex-column align-items-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3 brand-logo-mobile">
        <h5 class="offcanvas-title fw-bold">GlicoHealth™</h5>
      </div>
      <div class="btnClose d-flex">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
    </div>
    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <nav class="nav flex-column gap-3">
        <a class="nav-link active" href="#"><i class="fa-solid fa-house me-2"></i> Início</a>
        <a class="nav-link" href="#"><i class="bi bi-person me-2"></i> Perfil</a>
        <a class="nav-link" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
      </nav>
      <div>
        <a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/grafRegistroGlicemico.js') }}"></script>
  <script src="{{ url_for('static', filename='js/calendario.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

</body>

</html>
