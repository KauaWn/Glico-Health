<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Glico Health</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

  <div class="container-fluid p-3 p-md-4">
    <div class="row g-3">

      <aside class="coluna1 col-12 col-lg-2 d-none d-lg-block">
        <div class="sidebar p-3 text-center d-flex flex-column justify-content-between h-100">
          <div>
            <div class="brand mb-5">
               <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3">
                <h1>Glico Health</h1>
            </div>
            <nav class="nav flex-column gap-3 text-start ps-3">
              <a class="nav-link text-white active" href="#"><i class="bi bi-house me-2"></i> Início</a>
              <a class="nav-link text-white-50" href="#"><i class="bi bi-person me-2"></i> Perfil</a>
              <a class="nav-link text-white-50" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
            </nav>
          </div>
          <div>
            <a class="nav-link text-white-50 text-start ps-3" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
          </div>
        </div>
      </aside>

      <!-- BOTÃO MENU (APENAS MOBILE) -->
        <div class="col-12 d-lg-none mb-2">
            <button class="btn btn-menu-mobile d-flex align-items-center gap-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
                <i class="bi bi-list fs-4"></i>
            </button>
        </div>

      <main class="col-12 col-lg-7">
        <div class="d-flex flex-column gap-3">
          
          <div class="card-custom bemvindo p-3 bg-purple text-white d-flex align-items-center gap-3">
            <img src="{{ url_for('static', filename='img/macaquinho.jpg') }}" id="perfil-img" class="rounded-circle" alt="Foto de perfil">
            <div>
              <h5 class="mb-0">Seja bem-vindo(a), Usuário</h5>
              <small class="opacity-75">Acompanhe seus dados</small>
            </div>
          </div>

          <div class="card-custom p-3">
            <h6>Nível glicêmico</h6>
            <div style="height: 150px;" class="d-flex align-items-center justify-content-center text-muted">
              [Área do Gráfico de Linha]
            </div>
          </div>

          <div class="card-custom p-3">
            <h6>Pé diabético</h6>
            <div style="height: 150px;" class="d-flex align-items-center justify-content-center text-muted">
              [Área do Gráfico de Barras]
            </div>
          </div>

        </div>
      </main>

      <aside class="col-12 col-lg-3">
        <div class="card-custom p-3">
          <h6 class="mb-3">Junho 2026</h6>
          <div class="text-center text-muted" style="height: 250px;">
            [Componente de Calendário]
          </div>
        </div>
      </aside>

    </div>
  </div>

    <!-- OFFCANVAS MOBILE SIDEBAR -->
     <!-- MENU OFFCANVAS (MOBILE) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
    <div class="offcanvas-header">
        
        <img src="{{ url_for('static', filename='img/logo.png') }}" id="logo" alt="Logo" class="mb-3 brand-logo-mobile">
        <h5 class="offcanvas-title fw-bold">Glico Health™</h5>
        <!-- Adicionada a classe btn-close-white para o X ficar visível no fundo escuro -->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column justify-content-between">
        <nav class="nav flex-column gap-3">
        <a class="nav-link active" href="#"><i class="bi bi-house me-2"></i> Início</a>
        <a class="nav-link" href="#"><i class="bi bi-person me-2"></i> Perfil</a>
        <a class="nav-link" href="#"><i class="bi bi-droplet me-2"></i> Registro</a>
        </nav>
        <div>
        <a class="nav-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sair</a>
        </div>
    </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
